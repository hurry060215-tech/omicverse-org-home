abstract: >-
  We present pycopykat, a Python implementation of CopyKAT, which infers the copy numbers of single cells in 220 kb
  bins from their expression and calls each cell aneuploid or diploid without reference cells. pycopykat follows
  CopyKAT's code path, including R's random number generator and gamma draws, R's hierarchical clustering and the
  mixture models of mixtools, so that the same seed gives the same result as in R. On the six breast tumours of the
  CopyKAT paper (10,424 cells), pycopykat found the same breakpoints and the same diploid baseline as CopyKAT 1.2.5
  and made the same call for every cell; its copy-number matrices agreed with CopyKAT's to 6 × 10⁻¹¹. The
  known-normal, cell-line and Pearson-distance modes gave the same results as well. pycopykat ran 4.7 to 17 times
  faster than CopyKAT on one thread. It is used by OmicVerse for copy-number inference and is released at
  https://github.com/omicverse/py-CopyKAT and on PyPI.
keywords: [CopyKAT, copy-number variation, aneuploidy, tumour cells, single-cell RNA-seq, Python, reproducibility]
