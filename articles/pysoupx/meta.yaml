abstract: >-
  We present pysoupx, a Python implementation of SoupX for removing ambient RNA contamination from droplet-based
  single-cell RNA-seq data, covering the estimation of the ambient (soup) profile from empty droplets, the
  automatic and gene-set-based estimation of the contamination fraction, and the three methods for subtracting
  ambient counts. pysoupx follows SoupX's code paths step by step and is versioned against a specific SoupX
  release; its optional stochastic rounding uses R's random number generator. On five human–mouse mixtures
  from 10x Genomics (37,494 cells, up to 1.98 million droplets), in which counts from the other species reveal
  the ambient RNA, pysoupx estimated the same contamination fractions as SoupX 1.6.2 with the same marker genes,
  returned corrected counts that differ from SoupX's by at most 2 × 10⁻¹¹, and removed the same cross-species
  counts, while running 6.4–11.3 times faster on one thread. pysoupx is used by OmicVerse for ambient RNA removal
  and is released at https://github.com/omicverse/py-soupx and on PyPI.
keywords: [SoupX, ambient RNA, contamination, single-cell RNA-seq, quality control, Python, reproducibility]
