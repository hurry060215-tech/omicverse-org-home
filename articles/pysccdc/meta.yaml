abstract: >-
  We present pysccdc, a Python implementation of scCDC, which detects the genes that contaminate droplet-based
  single-cell and single-nucleus RNA-seq data from the entropy of their counts within cell clusters and corrects only
  those genes. pysccdc ports the code path of scCDC, including R's random number generator and sampling, R's
  smoothing spline and the ROC analysis used to set each gene's correction, so that it returns R's result. On four
  human–mouse mixtures from 10x Genomics (26,038 cells), pysccdc detected the same 18 to 102 contaminating genes as
  scCDC 1.4, in the same order, and returned identical corrected counts. It ran 11 to 50 times faster than scCDC on
  one thread. pysccdc is used by OmicVerse for ambient RNA correction and is released at
  https://github.com/omicverse/py-sccdc and on PyPI.
keywords: [scCDC, ambient RNA, contamination, entropy, single-cell RNA-seq, Python, reproducibility]
