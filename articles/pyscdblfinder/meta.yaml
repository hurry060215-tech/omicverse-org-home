abstract: >-
  We present pyscdblfinder, a Python implementation of scDblFinder for doublet detection in single-cell
  RNA-seq and ATAC-seq data, covering artificial-doublet generation, co-expression and nearest-neighbour
  features, the iterative gradient-boosted classifier, thresholding against the expected doublet rate,
  feature aggregation for chromatin data and AMULET. pyscdblfinder follows scDblFinder's code paths step by
  step and is versioned against a specific scDblFinder release; the steps that use no random numbers return
  the same values as R. On the 16 real datasets of an independent doublet-detection benchmark (168,239 cells,
  3–37% doublets annotated experimentally), pyscdblfinder detects annotated doublets as accurately as
  scDblFinder 1.16.0 (mean area under the precision–recall curve 0.560 versus 0.562), and its scores agree
  with scDblFinder's as closely as two runs of scDblFinder with different seeds (median Spearman correlation
  0.874 in both cases), while running 1.1–2.5 times faster on one thread. pyscdblfinder is the default
  doublet detector of OmicVerse quality control and is released under GPL-3.0 at
  https://github.com/omicverse/py-scDblFinder and on PyPI.
keywords: [scDblFinder, doublet detection, single-cell RNA-seq, quality control, xgboost, Python, reproducibility]
